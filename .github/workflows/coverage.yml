name: Coverage

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Ubuntu 24.04 / Clang / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-18

      - name: Report coverage tools
        run: |
          cmake --version
          ninja --version
          clang++ --version
          llvm-cov-18 --version
          llvm-profdata-18 --version

      - name: Configure, build, test, report, and enforce coverage
        run: cmake --workflow --preset linux-clang-coverage --fresh

      - name: Publish coverage report
        if: ${{ !cancelled() && hashFiles('build/linux-clang-coverage/coverage/coverage.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/linux-clang-coverage/coverage/
          if-no-files-found: error
          retention-days: 14
