name: Linux GCC

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-gcc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC / Debug
            preset: linux-gcc-debug
            compiler: g++
          - name: Linux GCC / Release
            preset: linux-gcc-release
            compiler: g++

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report build tools
        run: |
          cmake --version
          ninja --version
          "${{ matrix.compiler }}" --version

      - name: Configure, build, and test
        run: cmake --workflow --preset "${{ matrix.preset }}" --fresh
